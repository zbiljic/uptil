[tasks."swift:format"]
description = "Format Swift source code"
run = "swiftformat ."

[tasks."swift:format-check"]
description = "Check Swift source formatting"
run = "swiftformat --lint ."

[tasks."swift:lint"]
description = "Lint Swift source code"
run = '''
if test -f Project.swift || test -f Tuist.swift || \
    test -n "$(rg --files -g '*.swift' Sources Tests Packages 2>/dev/null | sed -n '1p')"; then
    swiftlint lint --strict
else
    swiftlint version >/dev/null
fi
'''
